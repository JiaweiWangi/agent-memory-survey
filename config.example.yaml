# 配置样例：复制为 config.yaml 后按需修改。凭证一律走环境变量（见 .env.example），不写入本文件。

project:
  data_dir: data
  sources_dir: sources
  runs_dir: runs

search:
  # OpenAlex：mailto 进礼貌池可获更稳定限额
  openalex_mailto: ""            # 填真实邮箱，留空则不加速
  openalex_per_page: 50
  # arXiv：实测连续快请求会触发 Rate exceeded，≥3s 间隔
  arxiv_min_interval_seconds: 3.0
  arxiv_max_results: 50
  # Semantic Scholar：429 限流严重，仅作增益源
  s2_enabled: true
  s2_max_retries: 3
  # 通用
  request_timeout_seconds: 30
  max_retries: 2
  response_cache_dir: data/derived/http_cache

agent:
  max_tool_steps_per_turn: 12    # 单回合最大工具行动数（EXECUTION_PLAN §6.5）
  max_retries: 2
  model_env_var: ANTHROPIC_DEFAULT_SONNET_MODEL   # 模型名从环境变量取，不硬编码
  max_output_tokens: 4096

model:
  # 凭证从环境变量读：ANTHROPIC_BASE_URL / ANTHROPIC_AUTH_TOKEN
  # 禁止在此文件填写任何 key 或 token
  record_usage: true             # 记录每次调用的 usage 到 runs/<id>/events.jsonl

draft:
  language: zh
  citation_style: numeric        # natbib 数字引用
  pending_marker: "【待核验】"   # 证据不足时草稿中的显式标记
